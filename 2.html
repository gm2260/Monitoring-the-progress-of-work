            --light-green: #E8F5E9;
            --accent-gold: #D4A843;
            --dark-gold: #B8942F;
            --light-gold: #FFF8E1;
            --text-dark: #1A1A2E;
            --text-medium: #4A4A5A;
            --text-light: #8A8A9A;
            --bg-warm: #FAFAF7;
            --bg-card: #FFFFFF;
            --border-subtle: #E8E8E0;
            --shadow-soft: 0 4px 24px rgba(27, 122, 63, 0.08);
            --shadow-medium: 0 8px 32px rgba(27, 122, 63, 0.12);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-warm);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            padding: 0;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 168, 67, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -5%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: white;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            padding: 6px;
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-text h1 {
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .brand-text span {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .header-stats {
            display: flex;
            gap: 24px;
        }

        .stat-pill {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50px;
            padding: 10px 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .stat-pill i {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        .stat-pill strong {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* ===== SEARCH BAR ===== */
        .search-section {
            background: white;
            border-bottom: 1px solid var(--border-subtle);
            padding: 20px 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }

        .search-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .search-box input {
            width: 100%;
            padding: 14px 50px 14px 20px;
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            color: var(--text-dark);
            background: var(--bg-warm);
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-green);
            background: white;
            box-shadow: 0 0 0 4px rgba(27, 122, 63, 0.1);
        }

        .search-box input::placeholder {
            color: var(--text-light);
        }

        .filter-toggle {
            padding: 14px 24px;
            background: var(--light-green);
            color: var(--primary-green);
            border: 2px solid var(--primary-green);
            border-radius: var(--radius-md);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            white-space: nowrap;
        }

        .filter-toggle:hover {
            background: var(--primary-green);
            color: white;
        }

        /* ===== FILTERS PANEL ===== */
        .filters-panel {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 32px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .filters-panel.open {
            max-height: 300px;
            padding: 20px 32px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .filter-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-medium);
            margin-bottom: 8px;
        }

        .filter-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.95rem;
            color: var(--text-dark);
            background: white;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-group select:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px;
        }

        /* Company Cards */
        .company-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }

        .company-card:hover {
            box-shadow: var(--shadow-medium);
        }

        .company-header {
            padding: 24px 28px;
            background: linear-gradient(90deg, var(--light-green) 0%, white 100%);
            border-bottom: 2px solid var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .company-header::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--primary-green);
        }

        .company-header:hover {
            background: linear-gradient(90deg, #D4EDDA 0%, white 100%);
        }

        .company-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .company-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-green);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .company-title h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .company-title .company-code {
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
        }

        .company-badges {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-depts {
            background: var(--light-gold);
            color: var(--dark-gold);
        }

        .badge-ccs {
            background: var(--light-green);
            color: var(--dark-green);
        }

        .expand-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-medium);
            transition: var(--transition);
            margin-right: 12px;
        }

        .company-header:hover .expand-icon {
            border-color: var(--primary-green);
            color: var(--primary-green);
            transform: rotate(180deg);
        }

        .company-header.collapsed .expand-icon {
            transform: rotate(0deg);
        }

        .company-header.collapsed:hover .expand-icon {
            transform: rotate(90deg);
        }

        /* Departments Grid */
        .departments-container {
            padding: 24px 28px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .departments-container.hidden {
            display: none;
        }

        .department-card {
            background: white;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
        }

        .department-card:hover {
            border-color: var(--accent-gold);
            box-shadow: 0 6px 20px rgba(212, 168, 67, 0.1);
            transform: translateY(-2px);
        }

        .dept-header {
            padding: 16px 20px;
            background: linear-gradient(90deg, #FFF8E1 0%, white 100%);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .dept-header:hover {
            background: linear-gradient(90deg, #FFECB3 0%, white 100%);
        }

        .dept-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dept-name i {
            color: var(--accent-gold);
            font-size: 0.9rem;
        }

        .dept-count {
            background: var(--accent-gold);
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 50px;
            min-width: 28px;
            text-align: center;
        }

        .dept-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
        }

        .dept-body.open {
            max-height: 50000px;
            padding: 16px 20px;
        }

        .cc-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cc-item {
            background: var(--bg-warm);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: var(--transition);
            cursor: default;
        }

        .cc-item:hover {
            background: white;
            border-color: var(--primary-green);
            box-shadow: 0 2px 8px rgba(27, 122, 63, 0.08);
        }

        .cc-code-box {
            background: var(--primary-green);
            color: white;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            min-width: 64px;
            text-align: center;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        .cc-details {
            flex: 1;
            min-width: 0;
        }

        .cc-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-dark);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .cc-desc {
            font-size: 0.85rem;
            color: var(--text-medium);
            line-height: 1.5;
        }

        .cc-desc:empty::before {
            content: '—';
            color: var(--text-light);
        }

        .cc-resp {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cc-resp i {
            font-size: 0.75rem;
        }

        /* No Results */
        .no-results {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-light);
        }

        .no-results i {
            font-size: 4rem;
            color: var(--border-subtle);
            margin-bottom: 20px;
            display: block;
        }

        .no-results h3 {
            font-size: 1.4rem;
            color: var(--text-medium);
            margin-bottom: 8px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 32px;
            color: var(--text-light);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-subtle);
            margin-top: 40px;
        }

        .footer img {
            height: 40px;
            opacity: 0.6;
            margin-bottom: 12px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-warm);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-green);
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .company-card {
            animation: fadeInUp 0.5s ease forwards;
        }

        .company-card:nth-child(1) { animation-delay: 0.05s; }
        .company-card:nth-child(2) { animation-delay: 0.1s; }
        .company-card:nth-child(3) { animation-delay: 0.15s; }
        .company-card:nth-child(4) { animation-delay: 0.2s; }
        .company-card:nth-child(5) { animation-delay: 0.25s; }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            .header-stats {
                flex-wrap: wrap;
                justify-content: center;
            }

            .search-inner {
                flex-direction: column;
            }

            .departments-container {
                grid-template-columns: 1fr;
                padding: 16px;
            }

            .company-header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .company-badges {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>

        // ===== STATE =====
        let expandedCompanies = new Set();
        let expandedDepts = new Set();
        let currentSearch = '';
        let currentCompanyFilter = '';
        let currentDeptFilter = '';

        // ===== DOM ELEMENTS =====
        const mainContent = document.getElementById('mainContent');
        const searchInput = document.getElementById('searchInput');
        const companyFilter = document.getElementById('companyFilter');
        const deptFilter = document.getElementById('deptFilter');
        const filterToggle = document.getElementById('filterToggle');
        const filtersPanel = document.getElementById('filtersPanel');
        const noResults = document.getElementById('noResults');

        // ===== INITIALIZATION =====
        function init() {
            populateFilters();
            updateStats();
            render();
            setupEventListeners();
        }

        function populateFilters() {
            // Company filter
            Object.entries(costCenterData).forEach(([code, data]) => {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${data.name} (${code})`;
                companyFilter.appendChild(option);
            });

            // Department filter (all unique depts)
            const allDepts = new Set();
            Object.values(costCenterData).forEach(company => {
                Object.keys(company.departments).forEach(dept => allDepts.add(dept));
            });
            Array.from(allDepts).sort().forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                deptFilter.appendChild(option);
            });
        }

        function updateStats() {
            let totalCompanies = 0;
            let totalDepts = 0;
            let totalCCs = 0;

            Object.entries(costCenterData).forEach(([code, company]) => {
                totalCompanies++;
                Object.entries(company.departments).forEach(([dept, ccs]) => {
                    totalDepts++;
                    totalCCs += ccs.length;
                });
            });

            document.getElementById('total-companies').textContent = totalCompanies;
            document.getElementById('total-depts').textContent = totalDepts;
            document.getElementById('total-ccs').textContent = totalCCs;
        }

        // ===== RENDERING =====
        function render() {
            mainContent.innerHTML = '';
            let hasResults = false;

            Object.entries(costCenterData).forEach(([companyCode, company]) => {
                // Filter by company
                if (currentCompanyFilter && currentCompanyFilter !== companyCode) return;

                // Filter departments
                const filteredDepts = {};
                Object.entries(company.departments).forEach(([deptName, ccs]) => {
                    // Filter by department
                    if (currentDeptFilter && currentDeptFilter !== deptName) return;

                    // Filter by search
                    const filteredCCs = ccs.filter(cc => {
                        if (!currentSearch) return true;
                        const search = currentSearch.toLowerCase();
                        return (
                            cc.name.toLowerCase().includes(search) ||
                            cc.description.toLowerCase().includes(search) ||
                            cc.code.toString().includes(search) ||
                            deptName.toLowerCase().includes(search)
                        );
                    });

                    if (filteredCCs.length > 0) {
                        filteredDepts[deptName] = filteredCCs;
                    }
                });

                if (Object.keys(filteredDepts).length === 0) return;
                hasResults = true;

                const companyCard = createCompanyCard(companyCode, company, filteredDepts);
                mainContent.appendChild(companyCard);
            });

            noResults.style.display = hasResults ? 'none' : 'block';
        }

        function createCompanyCard(companyCode, company, filteredDepts) {
            const card = document.createElement('div');
            card.className = 'company-card';

            const totalDepts = Object.keys(filteredDepts).length;
            const totalCCs = Object.values(filteredDepts).reduce((sum, ccs) => sum + ccs.length, 0);
            const isExpanded = expandedCompanies.has(companyCode);

            // Header
            const header = document.createElement('div');
            header.className = 'company-header' + (isExpanded ? '' : ' collapsed');
            header.innerHTML = `
                <div class="company-info">
                    <div class="company-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <div class="company-title">
                        <h2>${company.name}</h2>
                        <span class="company-code">كود الشركة: ${companyCode}</span>
                    </div>
                </div>
                <div class="company-badges">
                    <span class="badge badge-depts">
                        <i class="fas fa-folder"></i> ${totalDepts} قسم
                    </span>
                    <span class="badge badge-ccs">
                        <i class="fas fa-calculator"></i> ${totalCCs} مركز
                    </span>
                    <div class="expand-icon">
                        <i class="fas fa-chevron-down"></i>
                    </div>
                </div>
            `;
            header.addEventListener('click', () => toggleCompany(companyCode));

            // Departments container
            const deptsContainer = document.createElement('div');
            deptsContainer.className = 'departments-container' + (isExpanded ? '' : ' hidden');

            Object.entries(filteredDepts).forEach(([deptName, ccs]) => {
                const deptCard = createDepartmentCard(companyCode, deptName, ccs);
                deptsContainer.appendChild(deptCard);
            });

            card.appendChild(header);
            card.appendChild(deptsContainer);

            return card;
        }

        function createDepartmentCard(companyCode, deptName, ccs) {
            const card = document.createElement('div');
            card.className = 'department-card';

            const deptKey = `${companyCode}-${deptName}`;
            const isOpen = expandedDepts.has(deptKey);

            const header = document.createElement('div');
            header.className = 'dept-header';
            header.innerHTML = `
                <span class="dept-name">
                    <i class="fas fa-folder-open"></i>
                    ${deptName}
                </span>
                <span class="dept-count">${ccs.length}</span>
            `;
            header.addEventListener('click', () => toggleDepartment(companyCode, deptName));

            const body = document.createElement('div');
            body.className = 'dept-body' + (isOpen ? ' open' : '');

            const list = document.createElement('div');
            list.className = 'cc-list';

            ccs.forEach(cc => {
                const item = document.createElement('div');
                item.className = 'cc-item';
                item.innerHTML = `
                    <div class="cc-code-box">${cc.code}</div>
                    <div class="cc-details">
                        <div class="cc-name">${cc.name}</div>
                        <div class="cc-desc">${cc.description}</div>
                        ${cc.responsible ? `<div class="cc-resp"><i class="fas fa-user"></i> ${cc.responsible}</div>` : ''}
                    </div>
                `;
                list.appendChild(item);
            });

            body.appendChild(list);
            card.appendChild(header);
            card.appendChild(body);

            return card;
        }

        // ===== INTERACTIONS =====
        function toggleCompany(companyCode) {
            if (expandedCompanies.has(companyCode)) {
                expandedCompanies.delete(companyCode);
            } else {
                expandedCompanies.add(companyCode);
            }
            render();
        }

        function toggleDepartment(companyCode, deptName) {
            const key = `${companyCode}-${deptName}`;
            if (expandedDepts.has(key)) {
                expandedDepts.delete(key);
            } else {
                expandedDepts.add(key);
            }
            render();
        }

        function setupEventListeners() {
            // Search
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    currentSearch = e.target.value;
                    render();
                }, 200);
            });

            // Filters
            companyFilter.addEventListener('change', (e) => {
                currentCompanyFilter = e.target.value;
                render();
            });

            deptFilter.addEventListener('change', (e) => {
                currentDeptFilter = e.target.value;
                render();
            });

            // Toggle filters panel
            filterToggle.addEventListener('click', () => {
                filtersPanel.classList.toggle('open');
                const icon = filterToggle.querySelector('i');
                if (filtersPanel.classList.contains('open')) {
                    icon.className = 'fas fa-times';
                    filterToggle.querySelector('span').textContent = 'إخفاء';
                } else {
                    icon.className = 'fas fa-filter';
                    filterToggle.querySelector('span').textContent = 'تصفية';
                }
            });
        }

        // ===== START =====
        document.addEventListener('DOMContentLoaded', init);
    </script>


</body></html>
